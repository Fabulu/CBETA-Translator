name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT_FILE: ReadZen.App.csproj
  TFM: net8.0

  # Portable Git for Windows (fuller than MinGit; includes GCM/browser auth flow pieces)
  # Bump these together when updating.
  PORTABLE_GIT_VERSION: 2.49.0
  PORTABLE_GIT_FILE: PortableGit-2.49.0-64-bit.7z.exe
  PORTABLE_GIT_URL: https://github.com/git-for-windows/git/releases/download/v2.49.0.windows.1/PortableGit-2.49.0-64-bit.7z.exe

jobs:
  # ════════════════════════════════════════════════════════════════
  # PR-S3: single upstream job that builds the bundled search index
  # ONCE (was per-matrix-leg ×4 — see git history for the old inline
  # step), trims it to the query family, PROVES the trim + guid, and
  # hands the artifact to every build leg. It also hosts the
  # release-blocking `guid-bundle-guard`: a tag that bumps a search
  # BuildGuid without shipping a matching-guid bundle fails here, so
  # the whole install base can never cold-rebuild with zero signal
  # (SPEC §6.2 / §6.3).
  #
  # This job ALWAYS runs (never job-level `if:`-skipped), so downstream
  # `needs:` resolves cleanly and the guard runs on every tag even in
  # the vars-unset transition period — during which the guard is the
  # ONLY protection against a silent guid bump.
  # ════════════════════════════════════════════════════════════════
  prebuild-index:
    name: Prebuild bundled search index (once) + guid guard
    runs-on: ubuntu-latest
    outputs:
      # Current release binary's search family BuildGuid (always computed).
      build_guid: ${{ steps.guid.outputs.build_guid }}
      # 'true' only when a trimmed, guid-verified bundle was staged + uploaded.
      bundle_built: ${{ steps.build.outputs.bundle_built }}
      # '1' when a MISSING bundle is sanctioned for this run (vars unset =
      # transition, explicit SKIP_BUNDLE, or a prerelease tag vX.Y.Z-...).
      bundleless_ok: ${{ steps.mode.outputs.bundleless_ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Decide, once, whether this run should build a bundle and whether a
      # bundle-less outcome is sanctioned. Gating on the corpus-repo vars is a
      # transition-only affordance: unset ⇒ no bundle ⇒ releases behave exactly
      # as before S7 (first run cold-builds) — but the guid-guard below still runs.
      - name: Determine bundle mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          HAVE_VARS=0
          if [ -n "${{ vars.PREBUILT_INDEX_TEXTS_REPO }}" ] && [ -n "${{ vars.PREBUILT_INDEX_TRANS_REPO }}" ]; then
            HAVE_VARS=1
          fi

          SKIP_BUNDLE=0
          if [ "${{ vars.SKIP_BUNDLE }}" = "true" ]; then SKIP_BUNDLE=1; fi

          # A hyphenated tag (vX.Y.Z-dev1, -rc1, -pre …) is a prerelease: opt-in,
          # not pushed to the whole install base, so a bundle-less prerelease is fine.
          PRERELEASE=0
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE=1 ;; esac

          SHOULD_BUILD=0
          if [ "$HAVE_VARS" = "1" ] && [ "$SKIP_BUNDLE" = "0" ]; then SHOULD_BUILD=1; fi

          BUNDLELESS_OK=0
          if [ "$HAVE_VARS" = "0" ] || [ "$SKIP_BUNDLE" = "1" ] || [ "$PRERELEASE" = "1" ]; then
            BUNDLELESS_OK=1
          fi

          echo "should_build=$SHOULD_BUILD"   >> "$GITHUB_OUTPUT"
          echo "bundleless_ok=$BUNDLELESS_OK" >> "$GITHUB_OUTPUT"

          echo "mode: have_vars=$HAVE_VARS should_build=$SHOULD_BUILD skip_bundle=$SKIP_BUNDLE prerelease=$PRERELEASE bundleless_ok=$BUNDLELESS_OK (tag=$GITHUB_REF_NAME)"

      # Always compute the release binary's own search family guid. This is the
      # authority the validation + guard compare against. `--print-build-guid`
      # returns before Avalonia init, so it is safe on a display-less runner.
      # (Build/restore noise on stdout is harmless — we sed out our own line.)
      - name: Print current search BuildGuid
        id: guid
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(dotnet run -c Release --project "${{ env.PROJECT_FILE }}" -v quiet -- --print-build-guid)"
          echo "$OUT"
          GUID="$(printf '%s\n' "$OUT" | sed -n 's/^SearchBuildGuid=//p' | tr -d '[:space:]')"
          if [ -z "$GUID" ]; then
            echo "::error::--print-build-guid produced no SearchBuildGuid line"; exit 1
          fi
          echo "build_guid=$GUID" >> "$GITHUB_OUTPUT"
          echo "CUR_GUID=$GUID"   >> "$GITHUB_ENV"
          echo "Current search family BuildGuid: $GUID"

      # Build the bundle ONCE, trim to the query family, and PROVE both the trim
      # (allow/deny by explicit filename) and the guid EQUALITY (bundle manifest
      # BuildGuid == the binary's own guid — guards against a stale artifact /
      # build cache serving a prior binary). Only runs when the vars gate says so.
      - name: Build + trim + validate bundled index
        id: build
        if: steps.mode.outputs.should_build == '1'
        shell: bash
        run: |
          set -euo pipefail

          CORPUS_DIR="$RUNNER_TEMP/prebuilt-corpus"
          rm -rf "$CORPUS_DIR"
          mkdir -p "$CORPUS_DIR"

          echo "Cloning corpus repos (shallow) ..."
          git clone --depth 1 "${{ vars.PREBUILT_INDEX_TEXTS_REPO }}" "$CORPUS_DIR/texts"
          git clone --depth 1 "${{ vars.PREBUILT_INDEX_TRANS_REPO }}" "$CORPUS_DIR/trans"

          # Resolve the CBETA layout inside each clone (xml-p5 / xml-p5t).
          SRC="$CORPUS_DIR/texts/xml-p5"
          TRN="$CORPUS_DIR/trans/xml-p5t"
          if [ ! -d "$SRC" ]; then echo "::error::source dir $SRC not found in texts repo"; exit 1; fi
          if [ ! -d "$TRN" ]; then echo "::error::trans dir $TRN not found in trans repo"; exit 1; fi

          OUT="Assets/PrebuiltIndex"
          mkdir -p "$OUT"

          echo "Building bundled search index into $OUT ..."
          dotnet run -c Release --project "${{ env.PROJECT_FILE }}" -- \
            --build-search-index \
            --source-dir "$SRC" \
            --trans-dir  "$TRN" \
            --out-dir    "$OUT"

          if [ ! -f "$OUT/search.index.bin" ]; then
            echo "::error::--build-search-index did not produce search.index.bin"; exit 1
          fi

          # ── Trim (PR-S2, SPEC §5.1): ship only the QUERY family (bloom + inverted
          #    + corpusfreq + their manifests). Drop the 779 MB text sidecar (snippets
          #    fall back to XML parse when absent; the manifest MUST go with its bin)
          #    and the 235 MB build-only gramsets cache.
          echo "Trimming build-only / lazily-regenerated artifacts from the bundle ..."
          rm -f "$OUT/search.text.bin" \
                "$OUT/search.text.manifest.json" \
                "$OUT"/search.gramsets.*

          # ── Validate DENY list: prove the trim actually ran.
          for gone in search.text.bin search.text.manifest.json; do
            if [ -e "$OUT/$gone" ]; then echo "::error::trim failed: $gone still present"; exit 1; fi
          done
          if ls "$OUT"/search.gramsets.* >/dev/null 2>&1; then
            echo "::error::trim failed: search.gramsets.* still present"; exit 1
          fi

          # ── Validate ALLOW list: the whole query family must remain (a partial
          #    family shares one IndexStamp and would be rejected by loaders).
          for keep in search.index.bin search.index.manifest.json \
                      search.inverted.bin search.corpusfreq.bin search.corpusfreq.manifest.json; do
            if [ ! -e "$OUT/$keep" ]; then echo "::error::bundle missing required query artifact: $keep"; exit 1; fi
          done

          # ── Validate guid EQUALITY: the bundle's own manifest guid must equal the
          #    binary that will ship this release. Not-equal ⇒ a stale artifact or a
          #    format drift snuck in; fail loudly rather than seed a mismatched bundle.
          MANIFEST_GUID="$(sed -n 's/.*"BuildGuid"[: ]*"\([^"]*\)".*/\1/p' "$OUT/search.index.manifest.json" | head -n1)"
          if [ -z "$MANIFEST_GUID" ]; then
            echo "::error::could not read BuildGuid from $OUT/search.index.manifest.json"; exit 1
          fi
          if [ "$MANIFEST_GUID" != "$CUR_GUID" ]; then
            echo "::error::bundle BuildGuid ($MANIFEST_GUID) != release binary BuildGuid ($CUR_GUID) — stale artifact or format drift"; exit 1
          fi
          echo "Bundle guid matches release binary guid: $CUR_GUID"

          echo "Staged bundled index (trimmed):"
          ls -la "$OUT"

          echo "bundle_built=true" >> "$GITHUB_OUTPUT"

      # The single bundle every matrix leg downloads. Only uploaded when a bundle
      # was actually built + validated above.
      - name: Upload prebuilt index artifact
        if: steps.build.outputs.bundle_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-search-index
          path: Assets/PrebuiltIndex
          if-no-files-found: error
          retention-days: 7

      # ── Release-blocking guid-bundle-guard (SPEC §6.2 / §6.3 THE operability hole).
      #    If a matching-guid bundle ships this release, PASS. Otherwise recover the
      #    PREVIOUS release's shipped guid (its LAST_RELEASED_GUID asset — the release
      #    job below writes one every time). If the guid CHANGED and no bundle ships,
      #    every install would cold-rebuild with zero signal ⇒ FAIL the tag build.
      #    Bundle-less is allowed only when the guid is unchanged or the run is
      #    sanctioned; either way it is logged as a visible warning annotation.
      - name: guid-bundle-guard (release-blocking)
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CUR="$CUR_GUID"
          BUILT="${{ steps.build.outputs.bundle_built }}"
          BUNDLELESS_OK="${{ steps.mode.outputs.bundleless_ok }}"

          # A matching-guid bundle ships? The build step's validation already proved
          # (bundle manifest guid == CUR) before setting bundle_built=true.
          if [ "$BUILT" = "true" ]; then
            echo "guid-bundle-guard: PASS — a matching-guid bundle ($CUR) ships in this release."
            exit 0
          fi

          # No bundle this release. Recover the previous release's shipped guid.
          PREV=""
          PREV_TAG="$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$GITHUB_REF_NAME" ]; then
            if gh release download "$PREV_TAG" -p LAST_RELEASED_GUID -D _prevguid 2>/dev/null; then
              PREV="$(tr -d '[:space:]' < _prevguid/LAST_RELEASED_GUID || true)"
            fi
          fi

          if [ -z "$PREV" ]; then
            echo "::warning::guid-bundle-guard: no previous LAST_RELEASED_GUID asset found (bootstrap / first guarded release). Cannot compare; allowing bundle-less release with guid $CUR."
            exit 0
          fi

          if [ "$PREV" != "$CUR" ]; then
            echo "::error::guid-bundle-guard: search BuildGuid changed ($PREV -> $CUR) but this release ships NO matching bundle. Every install would cold-rebuild silently. Set PREBUILT_INDEX_* repo vars (and clear SKIP_BUNDLE) so prebuild-index cuts a matching bundle, or revert the guid bump."
            exit 1
          fi

          # guid unchanged ⇒ a bundle-less release does not churn the install base.
          if [ "$BUNDLELESS_OK" = "1" ]; then
            echo "::warning::guid-bundle-guard: shipping bundle-less (guid unchanged: $CUR; sanctioned — vars unset / SKIP_BUNDLE / prerelease)."
          else
            echo "guid-bundle-guard: PASS — guid unchanged ($CUR); no new bundle required."
          fi

  build:
    name: Build (${{ matrix.rid }})
    needs: prebuild-index
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            package: zip
          - os: ubuntu-latest
            rid: linux-x64
            package: tar
          - os: macos-latest
            rid: osx-x64
            package: zip
          - os: macos-latest
            rid: osx-arm64
            package: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Single source of truth for the release version: the git tag, stripped of
      # its leading 'v'. Every later step reads env.RELEASE_VERSION instead of
      # re-deriving it (the old per-step derivations could drift — audit R5-M3).
      - name: Derive release version from tag
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # ───────────────────────────────────────────────────────────────
      # S7 / PR-S3: stage the bundled prebuilt search index BEFORE publish, so the
      # csproj `<Content Include="Assets\PrebuiltIndex\**\*">` copies it into the
      # publish output. The bundle is built ONCE upstream (prebuild-index) and every
      # leg downloads the identical artifact — no per-leg clone+index (was 4×).
      # ───────────────────────────────────────────────────────────────
      - name: Download prebuilt index artifact (Assets/PrebuiltIndex)
        if: needs.prebuild-index.outputs.bundle_built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-search-index
          path: Assets/PrebuiltIndex

      # Explicit needs/if contract (SPEC §6.2 point 3): a skipped/bundle-less upstream
      # is NOT a GitHub Actions failure, so a leg must not silently ship without the
      # bundle it was supposed to carry. Absent bundle ⇒ FAIL, unless the run is a
      # sanctioned bundle-less pattern (vars unset / SKIP_BUNDLE / prerelease), in
      # which case the leg logs a warning and ships bundle-less (exactly today's
      # behavior — first run cold-builds).
      - name: Verify bundled index presence
        shell: bash
        run: |
          set -euo pipefail
          OUT="Assets/PrebuiltIndex"
          if [ -f "$OUT/search.index.bin" ]; then
            echo "Bundled prebuilt index present — will ship in this build:"
            ls -la "$OUT"
          elif [ "${{ needs.prebuild-index.outputs.bundleless_ok }}" = "1" ]; then
            echo "::warning::No prebuilt search index in this release — shipping bundle-less (sanctioned: vars unset / SKIP_BUNDLE / prerelease). First run does a cold build."
          else
            echo "::error::Prebuilt search index expected but absent for a non-sanctioned release (prebuild-index shipped no bundle). Refusing to ship a silently-degraded build."
            exit 1
          fi

      # One publish configuration for all platforms (bash is available on the
      # Windows runners too; the pwsh/bash twins had to be kept in sync by hand).
      - name: Publish
        shell: bash
        run: |
          dotnet restore "${{ env.PROJECT_FILE }}"
          dotnet publish "${{ env.PROJECT_FILE }}" \
            -c Release -r "${{ matrix.rid }}" --self-contained true \
            /p:PublishSingleFile=true \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            /p:DebugType=None /p:DebugSymbols=false

      - name: Ensure dictionary ships (assets/dict)
        shell: bash
        run: |
          PUB="bin/Release/${{ env.TFM }}/${{ matrix.rid }}/publish"
          mkdir -p "$PUB/Assets/Dict"
          cp -R "Assets/Dict/." "$PUB/Assets/Dict/"

      - name: Copy project license files into publish
        shell: bash
        run: |
          PUB="bin/Release/${{ env.TFM }}/${{ matrix.rid }}/publish"
          cp "LICENSE" "$PUB/LICENSE"
          cp "THIRD_PARTY_NOTICES.txt" "$PUB/THIRD_PARTY_NOTICES.txt"

      - name: Download Portable Git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force .ci-tools | Out-Null
          $dst = Join-Path $PWD.Path ".ci-tools\${{ env.PORTABLE_GIT_FILE }}"
          Write-Host "Downloading Portable Git: ${{ env.PORTABLE_GIT_URL }}"
          Invoke-WebRequest -Uri "${{ env.PORTABLE_GIT_URL }}" -OutFile $dst
          if (!(Test-Path $dst)) { throw "Portable Git download failed." }

      - name: Extract Portable Git into publish/tools/git/win-x64 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pub = Join-Path $PWD.Path "bin\Release\${{ env.TFM }}\${{ matrix.rid }}\publish"
          $gitRoot = Join-Path $pub "tools\git\win-x64"
          $archive = Join-Path $PWD.Path ".ci-tools\${{ env.PORTABLE_GIT_FILE }}"

          if (!(Test-Path $archive)) {
            throw "Portable Git archive not found: $archive"
          }

          Unblock-File -Path $archive -ErrorAction SilentlyContinue

          if (Test-Path $gitRoot) { Remove-Item $gitRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $gitRoot | Out-Null

          Write-Host "Extracting Portable Git to: $gitRoot"
          Write-Host "Archive: $archive"

          $proc = Start-Process `
            -FilePath $archive `
            -ArgumentList @("-y", "-o$gitRoot") `
            -NoNewWindow `
            -Wait `
            -PassThru

          if ($null -eq $proc) {
            throw "Failed to start Portable Git extractor process."
          }

          Write-Host "Extractor exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            throw "Portable Git extractor failed with exit code $($proc.ExitCode)"
          }

          $p1 = Join-Path $gitRoot "cmd\git.exe"
          $p2 = Join-Path $gitRoot "bin\git.exe"
          if (!(Test-Path $p1) -and !(Test-Path $p2)) {
            $sample = (Get-ChildItem -Recurse $gitRoot | Select-Object -First 80 FullName | Out-String)
            throw "Portable Git extracted, but git.exe not found in cmd/ or bin/. Contents:`n$sample"
          }

          Write-Host "Portable Git bundled successfully."
          Get-ChildItem $gitRoot | Select-Object Name, Mode | Format-Table -AutoSize

      - name: Collect bundled Git license files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pub = Join-Path $PWD.Path "bin\Release\${{ env.TFM }}\${{ matrix.rid }}\publish"
          $gitRoot = Join-Path $pub "tools\git\win-x64"
          $dst = Join-Path $pub "licenses\git-for-windows"

          if (!(Test-Path $gitRoot)) {
            throw "Git root not found: $gitRoot"
          }

          New-Item -ItemType Directory -Force $dst | Out-Null

          $patterns = @(
            "LICENSE*",
            "COPYING*",
            "ReleaseNotes*",
            "README*"
          )

          $found = New-Object System.Collections.Generic.List[string]

          foreach ($pattern in $patterns) {
            $matches = Get-ChildItem -Path $gitRoot -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue
            foreach ($m in $matches) {
              $target = Join-Path $dst $m.Name
              if (Test-Path $target) {
                $base = [System.IO.Path]::GetFileNameWithoutExtension($m.Name)
                $ext  = [System.IO.Path]::GetExtension($m.Name)
                $target = Join-Path $dst ("{0}_{1}{2}" -f $base, ([Guid]::NewGuid().ToString("N").Substring(0,8)), $ext)
              }
              Copy-Item $m.FullName $target -Force
              $found.Add($target)
            }
          }

          if ($found.Count -eq 0) {
            Write-Warning "No Git license/notice files matched expected patterns. Packaging continues, but verify PortableGit contents."
          } else {
            Write-Host "Collected Git license/notice files:"
            $found | ForEach-Object { Write-Host " - $_" }
          }

          $notice = @"
          Bundled component: Git for Windows (PortableGit)
          Version: ${{ env.PORTABLE_GIT_VERSION }}
          Source: ${{ env.PORTABLE_GIT_URL }}

          These files were copied from the extracted PortableGit bundle included in this release.
          "@

          Set-Content -Path (Join-Path $dst "BUNDLED_GIT_NOTICE.txt") -Value $notice -Encoding UTF8

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $rid = "${{ matrix.rid }}"
          $pub = "bin\Release\${{ env.TFM }}\${{ matrix.rid }}\publish"
          $out = "ReadZen-$rid-$tag"
          New-Item -ItemType Directory -Force dist | Out-Null

          $zipPath = "dist\$out.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          Compress-Archive -Path "$pub\*" -DestinationPath $zipPath
          Get-ChildItem dist | Format-Table -AutoSize

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          RID="${{ matrix.rid }}"
          PUB="bin/Release/${{ env.TFM }}/${{ matrix.rid }}/publish"
          OUT="ReadZen-${RID}-${TAG}"

          mkdir -p dist

          if [ "${{ matrix.package }}" = "zip" ]; then
            (cd "$PUB" && zip -r "$GITHUB_WORKSPACE/dist/${OUT}.zip" .)
          else
            tar -czf "dist/${OUT}.tar.gz" -C "$PUB" .
          fi

          ls -la dist

      # ───────────────────────────────────────────────────────────────
      # Velopack packaging (runs after zip packaging so both ship).
      # Linux is first-class per ewk-friendly-install SPEC. Windows +
      # macOS are unsigned for now (friction documented on the landing
      # page); add signing certs later if download volume warrants it.
      # ───────────────────────────────────────────────────────────────

      - name: Install Velopack CLI (vpk)
        shell: bash
        run: |
          dotnet tool install --global vpk --version 0.0.942
          # Make the tool visible on PATH for later steps
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Velopack pack (Windows Setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pub = "bin\Release\${{ env.TFM }}\${{ matrix.rid }}\publish"
          $veloOut = "dist\velopack"
          New-Item -ItemType Directory -Force $veloOut | Out-Null

          & vpk pack `
            --packId Fabulu.ReadZen `
            --packVersion "${{ env.RELEASE_VERSION }}" `
            --packDir "$pub" `
            --mainExe ReadZen.App.exe `
            --outputDir "$veloOut"

          Get-ChildItem $veloOut | Format-Table -AutoSize
          # Promote the installer + release metadata into dist/ for upload
          Copy-Item "$veloOut\*" dist\ -Force

      - name: Velopack pack (Linux AppImage)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          PUB="bin/Release/${{ env.TFM }}/${{ matrix.rid }}/publish"
          VELO_OUT="dist/velopack"
          mkdir -p "$VELO_OUT"

          vpk pack \
            --packId Fabulu.ReadZen \
            --packVersion "${{ env.RELEASE_VERSION }}" \
            --packDir "$PUB" \
            --mainExe ReadZen.App \
            --outputDir "$VELO_OUT"

          ls -la "$VELO_OUT"
          cp "$VELO_OUT"/* dist/

      # continue-on-error (NOT an inline `|| echo` swallow): a Velopack failure now
      # shows as a failed step in the run UI — the zip artifact still ships because
      # the job continues, but the missing installer is visible instead of silent
      # (audit R5-M3; the old `|| echo/|| true` tails hid real pack failures).
      - name: Velopack pack (macOS .pkg)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          PUB="bin/Release/${{ env.TFM }}/${{ matrix.rid }}/publish"
          VELO_OUT="dist/velopack"
          mkdir -p "$VELO_OUT"

          # macOS needs an unsigned bundle; notarization is a future upgrade
          # (see docs/VELOPACK_SETUP.md for when/why to add $99/yr Apple Dev).
          vpk pack \
            --packId Fabulu.ReadZen \
            --packVersion "${{ env.RELEASE_VERSION }}" \
            --packDir "$PUB" \
            --mainExe ReadZen.App \
            --outputDir "$VELO_OUT" \
            --noSignatureValidation

          ls -la "$VELO_OUT"
          cp -f "$VELO_OUT"/* dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release (single)
    needs: [prebuild-index, build]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # Record the search family guid this release ships as a small standalone
      # release asset. The NEXT release's guid-bundle-guard reads it to detect a
      # guid bump (see prebuild-index). Written every release — bundle or not — so
      # the guard has a baseline even during the vars-unset transition period.
      - name: Record released search guid asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' "${{ needs.prebuild-index.outputs.build_guid }}" > dist/LAST_RELEASED_GUID
          echo "Released search BuildGuid: $(cat dist/LAST_RELEASED_GUID)"

      - name: Show dist contents
        run: |
          ls -la dist

      - name: Create/Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
